# SBOM CycloneDX + Dependency-Track (pipelines de tag uniquement). Deux familles :
# - sources : dépendances npm déclarées par le workspace Angular (package-lock.json racine,
#   devDependencies et e2e exclus). Indispensable : les images nginx ne contiennent que les
#   bundles minifiés, aucune lib npm n'y est détectable ;
# - images : contenu de chaque image publiée (paquets OS, nginx).
# Chaque SBOM devient le projet enfant "dataEtat - <nom>" dans Dependency-Track.
include:
  - component: $CI_SERVER_FQDN/csm/gitlab-components/sbom-dir@5.2.0
    inputs:
      name: src-front-data
      path: .
      exclude: "./**/node_modules/** ./**/.venv/** ./e2e/**"

  # IMAGE_NAME : parallel:matrix du job "📋 sbom images", résolu à l'exécution.
  - component: $CI_SERVER_FQDN/csm/gitlab-components/sbom-image@5.2.0
    inputs:
      name: images
      image-ref: "${REGISTRY}${IMAGE_NAME}:${CI_COMMIT_TAG}"
      sbom-name: "img-${IMAGE_NAME##*/}"
      do-login: true
      registry: ${REGISTRY}
      registry-login: ${REGISTRY_USER}

  - component: $CI_SERVER_FQDN/csm/gitlab-components/dependency-track@5.2.0
    inputs:
      parent-name: "dataEtat"

.sbom-rules:
  stage: "📋 sbom"
  rules:
    - if: "$CI_COMMIT_TAG"

"📋 sbom src-front-data":
  extends: [".sbom-rules", ".sbom-dir-src-front-data"]
  needs: []

"📋 sbom images":
  extends: [".sbom-rules", ".sbom-image-images"]
  needs:
    - job: "🐳 dockerizing budget-dataetat"
    - job: "🐳 dockerizing france-relance"
    - job: "🐳 dockerizing data-qpv"
  parallel:
    matrix:
      - IMAGE_NAME:
          - "nocode/budget-dataetat"
          - "nocode/france-relance"
          - "nocode/data-qpv"

"🛡️ dependency-track upload":
  extends: ".dependency-track-upload"
  stage: "🛡️ dependency-track"
  rules:
    - if: "$CI_COMMIT_TAG"
  needs:
    - "📋 sbom src-front-data"
    - "📋 sbom images"
